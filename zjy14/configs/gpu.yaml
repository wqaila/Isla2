# GPU 与推理配置
#
# 每个字段都有实测依据，不是随意取值。
# 详见 docs/02_IMPLEMENTATION_PLAN.md 第 6.1 节。
#
# 环境变量覆盖：ZJY14_<大写字段名>，例如 ZJY14_PORT=50002

# ---- 引擎 ----
# stub: 占位引擎，产出正弦波，用于验证链路（不加载模型，启动快）
# cosyvoice3: 真实模型
engine: stub
device: cuda

# 实测：fp16 比 fp32 慢 7.1%、显存高 27%，故用 fp32。
# 见 docs/02_IMPLEMENTATION_PLAN.md 第三节。
precision: fp32

# ---- 并发 ----
# 实测（2026-11-16，probe/_p7_concurrency.py）：
#   单并发峰值 allocated 3550MB / reserved 3922MB
#   2并发峰值 allocated 3572MB / reserved 3924MB  <- 增量仅 +23MB
#   2 并发加速比 1.93x，剩余显存 2647MB（安全余量要求 1024MB）
# 结论：2 并发可行。但默认仍设 1，原因：
#   1. 单用户语音交互场景并发需求低
#   2. 多并发会放大采样随机性带来的时序抖动
#   3. 与 ASR 共存时显存更紧张（ASR 约 2GB）
# 若需放开，改为 2 并重启，实测无 OOM 风险。
max_concurrent_requests: 1
# 等待队列上限。超出返回 429，避免无界堆积拖垮服务。
max_queue_size: 8
# 排队超时。超时返回 503。
queue_timeout_s: 60
request_timeout_s: 120

# ---- 流式 ----
# 实测（2026-11-16，每组 3 次中位数）：
#   短句 10 字：非流式首包 1.60s vs 流式 1.67s（-4.4%，无收益）
#   中句 22 字：非流式 3.11s vs 流式 1.72s（+44.8%）
#   长句 44 字：非流式 5.36s vs 流式 1.48s（+72.4%）
# 短句流式无收益的原因：上游要攒够 28 token（约 1.12s 音频）才出第一包。
stream_enabled: true
# 路由阈值：有效字符数 >= 此值走流式。取 15（介于 10 与 22 之间）。
stream_char_threshold: 15

# ---- 优化开关 ----
# torch.compile 套用到 LLM 子模块。
# 实测（8 轮交错采样）：基线中位 3.049s -> compile 2.783s，
# 配对差值均值 -0.177s（相对改善 8.7%），8 轮中 7 轮更快。
# 代价：首次推理触发编译，冷启动敏感场景建议关闭。
enable_compile: false

# 注：以下 3 个开关经实测后已移除，不再作为配置项：
#   enable_sdpa     PyTorch 2.8 默认已启用 flash/mem_efficient SDPA，无作用
#   enable_vllm_llm 模型目录无 vllm/ 子目录，无可用权重
#   cpu_offload     CosyVoice3 无 offload 接口，手动搬运会破坏推理图

# ---- 缓存 ----
# 实测：缓存参考音频编码省 16.5% 合成耗时。
speaker_cache_enabled: true
speaker_cache_max_items: 8

# ---- 显存 ----
# 启动时要求的最小空闲显存。12GB 总量，桌面已占约 2.1GB。
memory_safety_margin_mb: 1024

# ---- 上游 bug 修复 ----
# token_hop_len 跨调用翻倍且不重置，导致首包 1.75s -> 2.25s。
token_hop_len_reset: true

# ---- 模型与文本前端 ----
# 留空则用默认位置 ~/models/Fun-CosyVoice3-0.5B-2512
model_dir: ""

# 文本前端（文本正则化）策略：
#   auto   尝试启用本地 wetext，失败则降级（默认）
#   wetext 强制启用，失败则启动报错
#   none   不启用
#
# 背景：wetext 的 __init__ 无条件联网校验，无 token 时 403 降级。
# 但 fst 资源已缓存在本地，本项目用补丁直接读取，无需 token。
# 启用后数字/符号会被正确朗读（2026 -> 二零二六），
# 实测音节 CV 从 0.818 提升到 0.909（节奏更自然）。
text_frontend: auto

# 未指定 voice_id 时使用的默认音色
default_voice_id: elysia

# 合成文本 / 参考文本 的最小长度比。
# 实测比值 0.21 时音色质心偏移 +490Hz，1.08 时仅 -56Hz。
# 上游 cosyvoice.py:94 也以 0.5 为警告阈值。
min_text_ratio: 0.5

# ---- 服务 ----
# 默认仅回环。对外开放监听必须同时设置 auth_token（否则启动报错）。
host: 127.0.0.1
port: 50001
auth_token: ""

# ---- 历史记录与日志保留 ----
# 合成记录保留天数。0 表示不自动清理。
# 后台线程按 cleanup_interval_hours 定期删除过期记录，并写入 cleanup_logs 审计表。
history_retain_days: 30
# 归档日志文件保留天数。只删 zjy14.log.YYYY-MM-DD，不动当前日志。
log_retain_days: 14
# 清理间隔（小时）。最小值会被钳到 1 分钟。
cleanup_interval_hours: 24