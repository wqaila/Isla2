# GPU 与推理配置
#
# 每个字段都有实测依据，不是随意取值。
# 详见 docs/02_IMPLEMENTATION_PLAN.md 第 6.1 节。
#
# 环境变量覆盖：ZJY14_<大写字段名>，例如 ZJY14_PORT=50002

# ---- 引擎 ----
# stub: 占位引擎，产出正弦波，用于 Phase 1 验证链路
# cosyvoice3: 真实模型（Phase 2 接入）
engine: stub
device: cuda

# 实测：fp16 比 fp32 慢 7.1%、显存高 27%，故用 fp32。
# 见 docs/02_IMPLEMENTATION_PLAN.md 第三节。
precision: fp32

# ---- 并发 ----
# 先单并发稳定，Phase 4 再逐步评估 2 并发。
max_concurrent_requests: 1
request_timeout_s: 120

# ---- 优化开关 ----
enable_compile: false
enable_sdpa: auto
# 模型目录 ~/models/Fun-CosyVoice3-0.5B-2512 无 vllm/ 子目录，不适用。
enable_vllm_llm: false

# ---- 缓存 ----
# 实测：缓存参考音频编码省 16.5% 合成耗时。
speaker_cache_enabled: true
speaker_cache_max_items: 8

# ---- 显存 ----
cpu_offload: false
# 启动时要求的最小空闲显存。12GB 总量，桌面已占约 2.1GB。
memory_safety_margin_mb: 1024

# ---- 上游 bug 修复 ----
# token_hop_len 跨调用翻倍且不重置，导致首包 1.75s -> 2.25s。
token_hop_len_reset: true

# ---- 服务 ----
# 默认仅回环。对外开放监听必须同时设置 auth_token（否则启动报错）。
host: 127.0.0.1
port: 50001
auth_token: ""
