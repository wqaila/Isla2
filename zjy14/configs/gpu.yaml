# GPU 与推理配置
#
# 每个字段都有实测依据，不是随意取值。
# 详见 docs/02_IMPLEMENTATION_PLAN.md 第 6.1 节。
#
# 环境变量覆盖：ZJY14_<大写字段名>，例如 ZJY14_PORT=50002

# ---- 引擎 ----
# stub: 占位引擎，产出正弦波，用于验证链路（不加载模型，启动快）
# cosyvoice3: 真实模型
engine: stub
device: cuda

# 实测：fp16 比 fp32 慢 7.1%、显存高 27%，故用 fp32。
# 见 docs/02_IMPLEMENTATION_PLAN.md 第三节。
precision: fp32

# ---- 并发 ----
# 先单并发稳定。TTS 峰值显存 3.45GB，12GB 总量理论上够 2-3 并发，
# 但 CUDA 上下文与中间张量会叠加，放开前需实测。
max_concurrent_requests: 1
# 等待队列上限。超出返回 429，避免无界堆积拖垮服务。
max_queue_size: 8
# 排队超时。超时返回 503。
queue_timeout_s: 60
request_timeout_s: 120

# ---- 流式 ----
# 实测（2026-11-16，每组 3 次中位数）：
#   短句 10 字：非流式首包 1.60s vs 流式 1.67s（-4.4%，无收益）
#   中句 22 字：非流式 3.11s vs 流式 1.72s（+44.8%）
#   长句 44 字：非流式 5.36s vs 流式 1.48s（+72.4%）
# 短句流式无收益的原因：上游要攒够 28 token（约 1.12s 音频）才出第一包。
stream_enabled: true
# 路由阈值：有效字符数 >= 此值走流式。取 15（介于 10 与 22 之间）。
stream_char_threshold: 15

# ---- 优化开关 ----
enable_compile: false
enable_sdpa: auto
# 模型目录 ~/models/Fun-CosyVoice3-0.5B-2512 无 vllm/ 子目录，不适用。
enable_vllm_llm: false

# ---- 缓存 ----
# 实测：缓存参考音频编码省 16.5% 合成耗时。
speaker_cache_enabled: true
speaker_cache_max_items: 8

# ---- 显存 ----
cpu_offload: false
# 启动时要求的最小空闲显存。12GB 总量，桌面已占约 2.1GB。
memory_safety_margin_mb: 1024

# ---- 上游 bug 修复 ----
# token_hop_len 跨调用翻倍且不重置，导致首包 1.75s -> 2.25s。
token_hop_len_reset: true

# ---- 模型与文本前端 ----
# 留空则用默认位置 ~/models/Fun-CosyVoice3-0.5B-2512
model_dir: ""

# 文本前端（文本正则化）策略：
#   auto   尝试启用本地 wetext，失败则降级（默认）
#   wetext 强制启用，失败则启动报错
#   none   不启用
#
# 背景：wetext 的 __init__ 无条件联网校验，无 token 时 403 降级。
# 但 fst 资源已缓存在本地，本项目用补丁直接读取，无需 token。
# 启用后数字/符号会被正确朗读（2026 -> 二零二六），
# 实测音节 CV 从 0.818 提升到 0.909（节奏更自然）。
text_frontend: auto

# 未指定 voice_id 时使用的默认音色
default_voice_id: elysia

# 合成文本 / 参考文本 的最小长度比。
# 实测比值 0.21 时音色质心偏移 +490Hz，1.08 时仅 -56Hz。
# 上游 cosyvoice.py:94 也以 0.5 为警告阈值。
min_text_ratio: 0.5

# ---- 服务 ----
# 默认仅回环。对外开放监听必须同时设置 auth_token（否则启动报错）。
host: 127.0.0.1
port: 50001
auth_token: ""
