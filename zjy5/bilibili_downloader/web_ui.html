<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B站视频 / 音频采集</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --fg:#e6e9ef; --dim:#98a2b3; --accent:#4f8cff; --ok:#39c07a;
    --bad:#e5586b; --warn:#e0a23a; --radius:10px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.55 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:22px 18px 60px}
  h1{font-size:19px;margin:0 0 4px;letter-spacing:.3px}
  .sub{color:var(--dim);font-size:12.5px;margin-bottom:18px}
  .sub code{background:var(--panel2);padding:1px 6px;border-radius:5px}
  .card{
    background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);padding:16px;margin-bottom:16px;
  }
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:5px}
  .field.grow{flex:1 1 320px;min-width:240px}
  label{font-size:12px;color:var(--dim)}
  input,select{
    background:var(--panel2);border:1px solid var(--line);color:var(--fg);
    border-radius:8px;padding:9px 11px;font:inherit;outline:none;
  }
  input:focus,select:focus{border-color:var(--accent)}
  input[type=text],input[type=url]{min-width:0}
  button{
    background:var(--accent);color:#fff;border:0;border-radius:8px;
    padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;
  }
  button:hover{filter:brightness(1.1)}
  button:disabled{opacity:.55;cursor:not-allowed}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);font-weight:500}
  button.ghost:hover{color:var(--fg);border-color:var(--accent)}
  button.danger{background:transparent;border:1px solid var(--bad);color:var(--bad)}
  .modes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .mode{
    padding:8px 14px;border-radius:999px;border:1px solid var(--line);
    background:var(--panel2);color:var(--dim);cursor:pointer;font-size:13px;
  }
  .mode.on{background:rgba(79,140,255,.16);border-color:var(--accent);color:#cfe0ff}
  .hint{font-size:12px;color:var(--dim);margin-top:8px}
  .status{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--dim)}
  .pill{display:inline-flex;gap:6px;align-items:center}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
  .dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)}
  .task{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--panel2)}
  .task .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .task .name{font-weight:600;word-break:break-all}
  .task .meta{font-size:12px;color:var(--dim);margin-top:3px}
  .bar{height:6px;border-radius:99px;background:#262b36;overflow:hidden;margin:9px 0}
  .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
  .bar.done i{background:var(--ok)} .bar.failed i{background:var(--bad)} .bar.cancelled i{background:var(--warn)}
  pre.log{
    margin:8px 0 0;padding:9px 11px;background:#0c0e12;border:1px solid var(--line);
    border-radius:8px;max-height:220px;overflow:auto;font:12px/1.5 Consolas,monospace;
    color:#a9b4c4;white-space:pre-wrap;word-break:break-all;
  }
  .outs{margin-top:8px;font-size:12.5px}
  .outs a{color:#8fbaff;text-decoration:none}
  .outs a:hover{text-decoration:underline}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--dim);font-weight:500}
  td.n{text-align:right;color:var(--dim);white-space:nowrap}
  .empty{color:var(--dim);font-size:13px;padding:10px 2px}
  .tag{font-size:11px;padding:1px 7px;border-radius:99px;background:#2a3140;color:#a9b4c4}
</style>
</head>
<body>
<div class="wrap">
  <h1>B站视频 / 音频采集</h1>
  <div class="sub">
    后台调用 <code>python -m bilibili_downloader</code>；产物落在
    <code id="dlDir">…</code>
  </div>

  <div class="card">
    <div class="modes" id="modes">
      <div class="mode on" data-mode="video">单个视频</div>
      <div class="mode" data-mode="audio">仅音频</div>
      <div class="mode" data-mode="subtitle">仅字幕</div>
      <div class="mode" data-mode="channel">UP 空间批量</div>
      <div class="mode" data-mode="search">搜索关键词</div>
      <div class="mode" data-mode="harvest">字幕收割</div>
    </div>

    <div class="row">
      <div class="field grow">
        <label id="targetLabel">视频链接 / BV 号</label>
        <input id="target" type="text" placeholder="https://www.bilibili.com/video/BV1xx411c7mD">
      </div>
      <button id="go">开始</button>
    </div>

    <div class="row" style="margin-top:12px">
      <div class="field" id="f-quality">
        <label>画质</label>
        <select id="quality">
          <option value="best">best</option><option value="2160">2160</option>
          <option value="1440">1440</option><option value="1080">1080</option>
          <option value="720">720</option><option value="480">480</option>
          <option value="360">360</option>
        </select>
      </div>
      <div class="field" id="f-audio">
        <label>音频格式</label>
        <select id="audio_format">
          <option value="mp3">mp3</option><option value="m4a">m4a</option>
          <option value="opus">opus</option><option value="wav">wav</option>
          <option value="flac">flac</option>
        </select>
      </div>
      <div class="field" id="f-subfmt">
        <label>字幕格式</label>
        <select id="sub_format">
          <option value="text">纯文本</option><option value="srt">SRT</option>
        </select>
      </div>
      <div class="field" id="f-max">
        <label>最多处理</label>
        <input id="max" type="text" value="10" style="width:96px">
      </div>
      <div class="field" id="f-order">
        <label>排序</label>
        <select id="order">
          <option value="">默认</option>
          <option value="pubdate">pubdate（最新）</option>
          <option value="hot">hot（最热）</option>
          <option value="view">view</option>
        </select>
      </div>
      <label class="pill" id="f-probe" style="display:none">
        <input id="probe_only" type="checkbox"> 只探测不落盘
      </label>
    </div>

    <div class="hint" id="hint">支持完整链接、<code>BV1xx411c7mD</code>、<code>b23.tv</code> 短链。</div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <div class="status" id="status">
        <span class="pill"><i class="dot"></i> 正在读取环境…</span>
      </div>
      <div style="display:flex;gap:8px">
        <button class="ghost" id="refreshCookie">重新校验 Cookie</button>
        <button class="ghost" id="clear">清空已结束任务</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">
      <strong style="font-size:13px">任务</strong>
      <span class="tag" id="taskCount">0</span>
    </div>
    <div id="tasks" class="empty">还没有任务。上面填链接点「开始」。</div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">
      <strong style="font-size:13px">产物</strong>
      <button class="ghost" id="refreshFiles">刷新</button>
    </div>
    <div id="files" class="empty">加载中…</div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let mode = "video";
let currentTask = null;      // 展开日志的任务 id
const openLogs = new Set();  // 用户手动展开过的任务

const HINTS = {
  video:    "支持完整链接、<code>BV1xx411c7mD</code>、<code>b23.tv</code> 短链。",
  audio:    "只取音轨并转成所选格式（需要 ffmpeg）。",
  subtitle: "只抓 B 站自带 CC / AI 字幕，不下载视频。",
  channel:  "填 UP 主空间链接（space.bilibili.com/xxx），按排序批量抓。",
  search:   "填关键词（不是链接），抓搜索结果并下载。",
  harvest:  "填 UP 空间链接或 urls.txt 绝对路径；只抄字幕，成本最低。",
};
const LABELS = {
  video: "视频链接 / BV 号", audio: "视频链接 / BV 号", subtitle: "视频链接 / BV 号",
  channel: "UP 主空间链接", search: "搜索关键词", harvest: "UP 空间链接 或 urls.txt",
};

function setMode(m){
  mode = m;
  document.querySelectorAll(".mode").forEach(el=>{
    el.classList.toggle("on", el.dataset.mode === m);
  });
  $("targetLabel").innerHTML = LABELS[m];
  $("hint").innerHTML = HINTS[m];
  const show = (id, on) => { $(id).style.display = on ? "" : "none"; };
  show("f-quality", m === "video" || m === "channel" || m === "search");
  show("f-audio",   m === "audio");
  show("f-subfmt",  m === "subtitle");
  show("f-max",     m === "channel" || m === "search" || m === "harvest");
  show("f-order",   m === "channel" || m === "search" || m === "harvest");
  show("f-probe",   m === "harvest");
  $("target").placeholder = {
    video: "https://www.bilibili.com/video/BV1xx411c7mD",
    audio: "https://www.bilibili.com/video/BV1xx411c7mD",
    subtitle: "https://www.bilibili.com/video/BV1xx411c7mD",
    channel: "https://space.bilibili.com/123456",
    search: "Python 教程",
    harvest: "https://space.bilibili.com/123456",
  }[m];
}

document.querySelectorAll(".mode").forEach(el=>{
  el.onclick = () => setMode(el.dataset.mode);
});

function human(bytes){
  if (!bytes) return "0 B";
  const u = ["B","KB","MB","GB"]; let i = 0; let v = bytes;
  while (v >= 1024 && i < u.length-1){ v /= 1024; i++; }
  return v.toFixed(v < 10 && i > 0 ? 2 : 0) + " " + u[i];
}
function fmtTime(ts){
  if (!ts) return "—";
  const d = new Date(ts*1000);
  return d.toLocaleTimeString("zh-CN", {hour12:false});
}

async function loadHealth(){
  try{
    const r = await fetch("/api/health"); const h = await r.json();
    $("dlDir").textContent = h.downloads;
    const items = [];
    items.push(`<span class="pill"><i class="dot ${h.ytdlp?'ok':'bad'}"></i> yt-dlp ${h.ytdlp || '未安装'}</span>`);
    items.push(`<span class="pill"><i class="dot ${h.ffmpeg?'ok':'warn'}"></i> ffmpeg ${h.ffmpeg? '已找到':'未找到（高清合并会失败）'}</span>`);
    let ck = 'warn', txt = 'Cookie 校验中…';
    if (h.cookie_ok === true)  { ck='ok';  txt = 'Cookie 有效 · ' + (h.cookie_message||''); }
    if (h.cookie_ok === false) { ck='bad'; txt = 'Cookie 无效 · ' + (h.cookie_message||''); }
    if (!h.cookie_exists)      { ck='bad'; txt = 'Cookie 文件不存在'; }
    items.push(`<span class="pill"><i class="dot ${ck}"></i> ${txt}</span>`);
    items.push(`<span class="pill">并发 ${h.running}/${h.max_concurrent}</span>`);
    $("status").innerHTML = items.join("");
  }catch(e){
    $("status").innerHTML = `<span class="pill"><i class="dot bad"></i> 读取环境失败：${e}</span>`;
  }
}

async function startTask(){
  const btn = $("go");
  const target = $("target").value.trim();
  if (!target){ $("target").focus(); return; }
  btn.disabled = true; btn.textContent = "启动中…";
  try{
    const payload = {
      mode,
      target,
      quality: $("quality").value,
      audio_format: $("audio_format").value,
      sub_format: $("sub_format").value,
      max: $("max").value,
      order: $("order").value,
      probe_only: $("probe_only").checked,
    };
    const r = await fetch("/api/tasks", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(payload),
    });
    const j = await r.json();
    if (!r.ok || !j.ok){ alert(j.error || ("启动失败：" + r.status)); return; }
    openLogs.add(j.task.id);
    await loadTasks();
  }catch(e){
    alert("请求失败：" + e);
  }finally{
    btn.disabled = false; btn.textContent = "开始";
  }
}

async function cancelTask(id){
  if (!confirm("取消这个任务？已下载的部分会保留，可续传。")) return;
  await fetch(`/api/tasks/${id}/cancel`, {method:"POST"});
  loadTasks();
}

function renderTasks(tasks){
  const box = $("tasks");
  $("taskCount").textContent = tasks.length;
  if (!tasks.length){ box.className = "empty"; box.textContent = "还没有任务。上面填链接点「开始」。"; return; }
  box.className = "";
  box.innerHTML = tasks.map(t=>{
    const stateText = {queued:"排队中", running:"进行中", done:"已完成",
                       failed:"失败", cancelled:"已取消"}[t.state] || t.state;
    const cls = t.state === "done" ? "done" : (t.state === "failed" ? "failed" : (t.state === "cancelled" ? "cancelled" : ""));
    const pct = t.state === "done" ? 100 : t.progress;
    const open = openLogs.has(t.id) || t.state === "running";
    const outs = (t.outputs||[]).map(p=>{
      const rel = p.replace(/^.*?[\\/]downloads[\\/]/, "");
      const url = "/api/files/" + encodeURIComponent(rel.replace(/\\/g,"/"));
      return `<a href="${url}" target="_blank">${p.split(/[\\/]/).pop()}</a>`;
    }).join("　");
    return `<div class="task">
      <div class="top">
        <div class="name">${escapeHtml(t.label)}</div>
        <div style="display:flex;gap:8px;align-items:center;white-space:nowrap">
          <span class="tag">${stateText}</span>
          ${["queued","running"].includes(t.state)
              ? `<button class="ghost" style="padding:4px 10px" onclick="cancelTask('${t.id}')">取消</button>`
              : `<button class="ghost" style="padding:4px 10px" onclick="toggleLog('${t.id}')">${open?'收起':'日志'}</button>`}
        </div>
      </div>
      <div class="meta">${t.id} · 用时 ${t.elapsed}s · 创建 ${fmtTime(t.created)}${t.error? ' · '+escapeHtml(t.error):''}</div>
      <div class="bar ${cls}"><i style="width:${Math.min(100,pct)}%"></i></div>
      ${outs? `<div class="outs">产物：${outs}</div>`:""}
      ${open? `<pre class="log" id="log-${t.id}">载入中…</pre>`:""}
    </div>`;
  }).join("");
  tasks.forEach(t=>{
    if (openLogs.has(t.id) || t.state === "running") fillLog(t.id);
  });
}

function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c=>(
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

const logCache = {};
async function fillLog(id){
  try{
    const r = await fetch(`/api/tasks/${id}`);
    if (!r.ok) return;
    const t = await r.json();
    const el = document.getElementById(`log-${id}`);
    if (!el) return;
    const lines = t.log || [];
    const text = lines.join("\n");
    if (logCache[id] === text) return;
    logCache[id] = text;
    const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
    el.textContent = text || "（暂无输出）";
    if (atBottom) el.scrollTop = el.scrollHeight;
  }catch(e){ /* 轮询期间的瞬时错误忽略 */ }
}

function toggleLog(id){
  if (openLogs.has(id)) openLogs.delete(id); else openLogs.add(id);
  loadTasks();
}

async function loadTasks(){
  try{
    const r = await fetch("/api/tasks"); const j = await r.json();
    renderTasks(j.tasks || []);
  }catch(e){ /* ignore */ }
}

async function loadFiles(){
  try{
    const r = await fetch("/api/files"); const j = await r.json();
    const box = $("files");
    if (!j.files || !j.files.length){
      box.className = "empty"; box.textContent = "目录还是空的。"; return;
    }
    box.className = "";
    box.innerHTML = `<table><thead><tr>
        <th>文件</th><th>类型</th><th style="text-align:right">大小</th>
        <th style="text-align:right">时间</th></tr></thead><tbody>
      ${j.files.map(f=>`<tr>
        <td><a href="${f.url}" target="_blank" style="color:#8fbaff;text-decoration:none">${escapeHtml(f.rel)}</a></td>
        <td><span class="tag">${f.kind}</span></td>
        <td class="n">${human(f.size)}</td>
        <td class="n">${fmtTime(f.mtime)}</td>
      </tr>`).join("")}
      </tbody></table>`;
  }catch(e){
    $("files").className = "empty";
    $("files").textContent = "读取失败：" + e;
  }
}

$("go").onclick = startTask;
$("target").addEventListener("keydown", e=>{ if (e.key === "Enter") startTask(); });
$("refreshCookie").onclick = async () => {
  $("refreshCookie").disabled = true;
  try{
    await fetch("/api/cookie-check", {method:"POST"});
    await loadHealth();
  } finally { $("refreshCookie").disabled = false; }
};
$("clear").onclick = async () => {
  await fetch("/api/tasks/clear", {method:"POST"});
  openLogs.clear(); logCache && Object.keys(logCache).forEach(k=>delete logCache[k]);
  loadTasks();
};
$("refreshFiles").onclick = loadFiles;

setMode("video");
loadHealth(); loadTasks(); loadFiles();
setInterval(loadTasks, 1500);
setInterval(()=>{ if (document.querySelector(".task")) loadFiles(); }, 8000);
setInterval(loadHealth, 30000);
</script>
</body>
</html>
